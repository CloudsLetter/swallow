<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swallow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Helvetica Neue', sans-serif;
            background: #0a0a0c;
            color: #f4f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
            user-select: none;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out both;
        }

        /* 细线终端图标：克制、无装饰动画 */
        .mark {
            width: 60px;
            height: 44px;
            margin-bottom: 26px;
            opacity: 0.92;
        }

        .mark .line {
            stroke: rgba(244, 244, 246, 0.85);
            stroke-width: 1.4;
            stroke-linecap: round;
        }

        .mark .line.sub {
            stroke: rgba(244, 244, 246, 0.22);
        }

        .cursor {
            stroke: #818cf8;
            stroke-width: 2;
            animation: blink 1.15s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .name {
            font-size: 30px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-indent: 0.12em;
            color: #f4f4f6;
        }

        .tagline {
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 0.28em;
            text-indent: 0.28em;
            color: #6b7078;
            font-weight: 400;
        }

        /* 底部：状态圆点 + 文案 */
        .status {
            position: absolute;
            bottom: 34px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: #8b909a;
        }

        .pulse {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #6366f1;
            animation: breathe 1.6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.35;
                transform: scale(0.86);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .status.is-done .pulse {
            background: #34d399;
            animation: none;
            opacity: 1;
        }

        .version {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #3d4046;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- 细线终端：两行代码 + 行尾光标 -->
        <svg class="mark" viewBox="0 0 60 44" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="57" height="41" rx="7" class="line" />
            <path d="M9 12 h18" class="line sub" />
            <path d="M9 18 h30" class="line sub" />
            <path d="M9 24 h12" class="line" opacity="0.55" />
            <path d="M24 28 h10" class="cursor" />
        </svg>

        <h1 class="name">Swallow</h1>
        <p class="tagline">SSH &middot; SFTP &middot; TELNET</p>
    </div>

    <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">Initializing</span>
    </div>

    <div class="version">v0.1.0</div>

    <script>
        if (window.__TAURI__) {
            window.__TAURI__.event.listen('init-status', (event) => {
                const text = document.getElementById('statusText');
                const box = document.getElementById('status');
                const raw = event && event.payload && event.payload.message;
                if (!text) return;
                let label = 'Initializing';
                if (raw) {
                    if (raw.includes('配置')) label = 'Loading config';
                    else if (raw.includes('资源')) label = 'Loading assets';
                    else if (raw.includes('就绪')) { label = 'Ready'; box.classList.add('is-done'); }
                    else label = 'Initializing';
                }
                text.textContent = label;
            });
        }
    </script>
</body>
</html>
