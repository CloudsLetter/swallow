[package]
name = "swallow"
version = "0.1.0"
description = "ssh client software based on tauri"
authors = ["CloudsLetter <wojiuchigua@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swallow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
serde_json = "1"
ssh2 = "0.9"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
chrono = "0.4"
suppaftp = "5.2"
portable-pty = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
serde_yaml = "0.9.34"
dirs = "6.0.0"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
rand = "0.8"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }

# keyring 按平台选择系统凭据 backend（跨平台打包必需；不可统一放顶层）
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# mac/linux CI 无系统 OpenSSL：vendored 让 openssl-src 为对应架构自动编译
# （mac 自带 perl、ubuntu runner 也有；Windows 本机无 perl，保持系统 openssl 方案）
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
