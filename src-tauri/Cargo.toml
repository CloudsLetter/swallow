[package]
name = "swallow"
version = "0.1.5"
description = "ssh client software based on tauri"
authors = ["CloudsLetter <wojiuchigua@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swallow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
chrono = "0.4"
suppaftp = "11"
encoding_rs = "0.8"
portable-pty = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
serde_yaml = "0.9.34"
dirs = "6.0.0"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
rand = "0.8"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serialport = "4"

# RDP（IronRDP）：协议端全在 Rust（NLA/CredSSP 认证 + 帧解码），前端只做 canvas 渲染。
# 锁精确 minor：0.x 家族成批 breaking，升级需整体核对 API。
ironrdp-client = { version = "0.1.0", features = ["rustls"] }
ironrdp-input = "0.7.0"
ironrdp-pdu = "0.9.0"
smallvec = "1.15"
# 显式声明以启用 rustls::crypto::ring（进程级 CryptoProvider 安装用）：
# 依赖图中 reqwest 与 ironrdp-tls 分别引入 ring 与 aws-lc-rs，rustls 无法自动二选一，
# 不显式 install_default 会在首次 TLS 使用处 panic（见 lib.rs run() setup）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MOSH：wire-compatible Rust 客户端（SSP/AES-OCB3 + vt100 仿真 + 本地回显预测），
# 配合本模块的 SSH 引导（mosh-server new）组成完整 MOSH 会话。0.x 锁 minor。
mosh-rs = "0.1.0"

# keyring 按平台选择系统凭据 backend（跨平台打包必需；不可统一放顶层）
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native", "crypto-rust"] }
# WebView2 原生 WebMessage 附加对象（CoreWebView2File → DOM File 真实路径），拖拽上传直读通道
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# ⚠️ 做 RDP/MOSH 等重解码协议的性能对比/测试时：dev 构建（未优化）的依赖代码
# 慢 10-50 倍，结论不可信——请用 `pnpm tauri build` 的 release 包测试，
# 或临时取消下面注释让依赖全速跑（自身代码仍 opt-level 0，迭代不受影响）：
# [profile.dev.package."*"]
# opt-level = 2
