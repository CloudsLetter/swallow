name: CrabNebula Cloud Release

# 用途：把 tag 发布同时推送到 CrabNebula Cloud（CDN + 内置更新服务器），
# 配合 tauri-plugin-updater 实现自动更新分发。
#
# 启用条件（未配置时本工作流所有 job 自动跳过，不影响 .github/workflows/release.yml）：
#   1. GitHub repo → Settings → Secrets and variables → Actions：
#      - CN_API_KEY        ：CrabNebula Cloud 组织下创建的 API key（Read/Write）
#      - TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD：更新签名密钥
#   2. Settings → Variables 里新增 CN_APPLICATION = <org-slug>/<app-slug>
#      （或直接把下方 env.CN_APPLICATION 的占位替换为你的 org/app）
#
# 触发方式：与 release.yml 一致，push v* tag 或手动触发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 你的 Cloud org/app 标识，形如 cloudsletter/swallow
  CN_APPLICATION: "${{ vars.CN_APPLICATION }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    # job 级 if 无法访问 secrets（仅 step 级可用），故只在此检查 vars；
    # CN_API_KEY 的守卫放到 guard step 并通过 outputs.enabled 传给下游 job。
    if: ${{ vars.CN_APPLICATION != '' }}
    runs-on: ubuntu-22.04
    outputs:
      # 下游 build/publish 据此判断是否真正发布（CN_API_KEY 是否已配置）
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Guard (CN_API_KEY configured?)
        # secrets 只能经 env/with 注入，再在 shell/if 中判定；禁止任何 if 直接引用
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
        run: echo "enabled=${{ env.CN_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        # if 条件禁止引用 secrets（无论 job 级还是 step 级），
        # 改用 guard step 的输出判断（guard 在 run 内比较 secrets 是允许的）
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: [draft]
    # CN_API_KEY 未配置时（draft.enabled=false）跳过整个矩阵构建；
    # draft 自身被跳过（vars 为空）时本 job 也会随 needs 链自动跳过
    if: ${{ needs.draft.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev

      # vendored OpenSSL 构建需要 perl + nasm（见 release.yml）
      - name: Setup NASM
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Setup Perl
        if: matrix.platform == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Enable OpenSSL assembly
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          "OPENSSL_RUST_USE_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          nasm -v
          perl -v

      - name: Build (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # createUpdaterArtifacts 开启后打包必须带签名密钥
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}

      - name: Upload assets to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: src-tauri

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
