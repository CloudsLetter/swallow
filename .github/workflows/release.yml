name: Release

# 触发方式：
#   1. 推送形如 v0.1.0 的 tag：git tag v0.1.0 && git push origin v0.1.0
#   2. GitHub 页面手动触发（Actions → Release → Run workflow）
# 产物：
#   Windows —— NSIS 安装包、MSI、绿色 exe（tauri-action 上传），另加「-full」NSIS
#              （内嵌 WebView2 离线安装器，供未预装 WebView2 的机器离线安装）
#   macOS   —— dmg（aarch64 + x86_64）
#   Linux   —— deb / AppImage（ubuntu-22.04）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Swallow ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  build:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev

      # vendored OpenSSL 构建需要 perl + nasm：缺 nasm 会退化成 no-asm 纯软加密
      # （SFTP 限速、CPU 高）。用专用 action 显式安装，不依赖 runner 预装 Strawberry Perl。
      - name: Setup NASM
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Setup Perl
        if: matrix.platform == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Enable OpenSSL assembly
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          "OPENSSL_RUST_USE_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          # 自检：工具缺失时让本步直接失败，避免静默退化成 no-asm 发布
          nasm -v
          perl -v

      - name: Build & upload (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          # 无开发者证书时跳过签名查找，避免 mac/win 打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          args: ${{ matrix.args }}

  # Windows -full：NSIS 内嵌 WebView2 离线安装器（~150MB），供无网/未装 WebView2 的机器
  build-full-windows:
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Switch to offline WebView2 installer mode
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.windows={webviewInstallMode:{type:'offlineInstaller'}};fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      # vendored OpenSSL 构建需要 perl + nasm：缺 nasm 会退化成 no-asm 纯软加密
      # （SFTP 限速、CPU 高）。用专用 action 显式安装，不依赖 runner 预装 Strawberry Perl。
      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Enable OpenSSL assembly
        shell: pwsh
        run: |
          "OPENSSL_RUST_USE_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          # 自检：工具缺失时让本步直接失败，避免静默退化成 no-asm 发布
          nasm -v
          perl -v

      - name: Build full bundle
        run: pnpm tauri build

      - name: Upload -full installer to release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          cd src-tauri/target/release/bundle/nsis
          mv swallow_${ver}_x64-setup.exe swallow_${ver}_x64-full-setup.exe
          gh release upload "v${ver}" swallow_${ver}_x64-full-setup.exe --clobber
